# Fetches EPA CyAN satellite data for every covered US lake 4 times a day
# (scripts/fetch_lakes.py) and commits data/lakes/ when it changes, so every
# lake pin and lake card in the app has fresh verdicts. Each run takes about
# 70-80 minutes, because the per-lake check asks EPA about one lake at a time.
name: Fetch lake satellite data

on:
  schedule:
    # 4 times a day, at 47 minutes past 1, 7, 13 and 19 UTC: halfway between
    # the Jordan Lake bot's runs (17 minutes past 0, 6, 12 and 18)
    - cron: "47 1,7,13,19 * * *"
  # Adds a "Run workflow" button on GitHub for manual runs
  workflow_dispatch:

# Lets this workflow push the updated lake files back to the repo
permissions:
  contents: write

# One run at a time: a new run waits for the last one instead of both
# asking EPA at once
concurrency:
  group: fetch-lakes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the script's libraries
        run: pip install pillow numpy

      - name: Fetch the latest lake satellite data
        run: python scripts/fetch_lakes.py

      # The Jordan Lake bot may have committed cyan.json during this long
      # run, so get its commit first (git pull --rebase), then push
      - name: Commit the lake files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lakes/index.json data/lakes/readings.json
          git diff --cached --quiet && exit 0
          git commit -m "Update lake satellite data"
          git pull --rebase
          git push
